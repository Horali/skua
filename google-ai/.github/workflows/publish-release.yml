name: Publish ePlus AI Toolkit (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1, 1.1.0, 2.0.0-rc.1; do not prefix v)"
        type: string
        required: true
      verified_device_smoke:
        description: "I completed docs/WINDOWS-SMOKE-TEST.md on real Windows + MuMu (no checkout)"
        type: boolean
        required: true
        default: false
      prerelease:
        description: "Mark this release as pre-release (required for -rc, -beta or similar)"
        type: boolean
        required: true
        default: false

concurrency:
  group: publish-eplus-ai-toolkit-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/windows-release-smoke.yml

  publish:
    name: Verify and publish source release
    needs: windows-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      DEVICE_VERIFIED: ${{ inputs.verified_device_smoke }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release input, main and manual sign-off
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish releases only from main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be SemVer without v prefix (e.g. 1.2.3 or 1.2.3-rc.1)."
            exit 1
          fi
          if [ "$DEVICE_VERIFIED" != "true" ]; then
            echo "::error::Real Windows + MuMu Step 0/1 smoke verification is required."
            exit 1
          fi
          if [[ "$VERSION" == *-* ]] && [ "$PRERELEASE" != "true" ]; then
            echo "::error::Pre-release versions must be marked pre-release."
            exit 1
          fi
          test -f docs/WINDOWS-SMOKE-TEST.md
          git fetch origin main --quiet
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::main moved during release; rerun on the latest commit."
            exit 1
          fi

      - name: Require passing main Static checks for this exact commit
        shell: bash
        run: |
          set -euo pipefail
          url="repos/$GITHUB_REPOSITORY/actions/workflows/static-checks.yml/runs?branch=main&per_page=25"
          state="$(gh api "$url" --jq "[.workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | .conclusion] | first // \"\"")"
          if [ "$state" != "success" ]; then
            echo "::error::Static checks for main commit $GITHUB_SHA must succeed (status: $state)."
            exit 1
          fi

      - name: Reject previously published versions or tags
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; refusing to overwrite."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists; refusing to overwrite."
            exit 1
          fi

      - name: Publish requested version
        shell: bash
        run: |
          set -euo pipefail
          args=(release create "$VERSION" --target "$GITHUB_SHA" --title "ePlus AI Toolkit v$VERSION")
          notes_file="docs/releases/v$VERSION.md"
          if [ -f "$notes_file" ]; then
            echo "Using prepared notes: $notes_file"
            args+=(--notes-file "$notes_file")
          else
            echo "No version-specific changelog found; generating release notes from merged PRs."
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
